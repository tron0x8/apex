# which args carry taint through php builtins
# str_replace($search, $replace, $subject) - only $subject (arg 2) propagates
propagators:
  - name: str_replace
    propagates_from: [2]
  - name: str_ireplace
    propagates_from: [2]
  - name: substr
    propagates_from: [0]
  - name: substr_replace
    propagates_from: [0]
  - name: strtolower
    propagates_from: [0]
  - name: strtoupper
    propagates_from: [0]
  - name: ucfirst
    propagates_from: [0]
  - name: lcfirst
    propagates_from: [0]
  - name: ucwords
    propagates_from: [0]
  - name: trim
    propagates_from: [0]
  - name: ltrim
    propagates_from: [0]
  - name: rtrim
    propagates_from: [0]
  - name: nl2br
